# Podcast RAG — Full Stack
#
# Services:
#   api         -> FastAPI + Uvicorn (port 8000)
#   bot         -> Telegram aiogram bot (no exposed port, uses webhook)
#   worker      -> ARQ async task worker (ingestion jobs)
#   redis       -> Session cache, task queue broker (port 6379)
#   postgres    -> Persistent storage: rate limits, notes, logs (port 5432)
#   qdrant      -> Vector DB for embeddings (port 6333)
#   mlflow      -> Experiment tracking UI (port 5000)
#   prometheus  -> Metrics scraping (port 9090)
#   grafana     -> Metrics dashboards (port 3000)

services:
  api:
    profiles: ["debug"]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "powershell", "-command", "try { $response = iwr http://localhost:8080/health -UseBasicParsing; if ($response.StatusCode -eq 200) { return 0 } else { return 1 } } catch { return 1 }"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  bot:
    profiles: ["debug"]
    build: 
      context: .
      dockerfile: docker/Dockerfile.bot
    env_file: .env 
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ARQ Worker
  worker:
    profiles: ["debug"]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: ["python", "-m", "arq", "api.workers.run_worker"]
    env_file: .env 
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: podcast_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d podcast_rag"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.0
    ports:
      - "6333:6333"
      - "6334:6334"                       # gRPC port
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped

  mlflow:
    profiles: ["prod"]
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/mlflow
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    profiles: ["debug"]
    image: prom/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped

  grafana:
    profiles: ["debug"]
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  qdrant_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: podcast_rag_network