name: Podcast RAG CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with: 
                python-version: "3.14"

            - name: Install uv
              uses: astral-sh/setup-uv@v1(https://github.com/marketplace/actions/astral-sh-setup-uv)
              with:
                version: "" 

            - name: Install dependencies
              run: | 
                uv sync --system

            - name: Validate agent graph
              run: |
                python -c "
                from src.agents.agent_v1 import build_graph
                app = build_graph()
                print('Graph compiled sucessfully')
                "